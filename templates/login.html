<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Signal Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .login-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            text-align: center;
            color: #00f0ff;
            margin-bottom: 24px;
            font-size: 1.5em;
        }
        .login-card input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .login-card input[type="password"]:focus {
            border-color: #00f0ff;
            outline: none;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            background: #00f0ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        .login-card button:hover {
            background: #3d8ee0;
        }
        .login-error {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Signal Bot</h1>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <input type="password" name="secret" placeholder="Enter access key" autofocus required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
